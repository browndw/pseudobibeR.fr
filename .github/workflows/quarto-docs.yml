name: Build and Deploy Quarto Docs

on:
  push:
    tags:
      - 'v*.*'  # Triggers on version tags like v1.0.0, v1.1.0, etc.
    paths:
      - '_quarto/**'
      - '.github/workflows/quarto-docs.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::devtools
            any::mda.biber
            any::gt
            any::gtsummary
            any::broom
            any::broom.helpers
            any::ggplot2
            any::tidyr
            any::dplyr
            any::stringr
            any::tibble
            any::udpipe
            any::knitr
            any::rmarkdown
          cache-version: 2

      - name: Install pseudobibeR.fr package
        run: |
          devtools::install(upgrade = FALSE)
        shell: Rscript {0}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto site
        working-directory: _quarto
        run: quarto render

      - name: Add .nojekyll file
        run: touch _quarto/_site/.nojekyll

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          publish_dir="$RUNNER_TEMP/gh-pages-worktree"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add "$publish_dir" origin/gh-pages
            cd "$publish_dir"
            git checkout -B gh-pages origin/gh-pages
          else
            git worktree add --detach "$publish_dir"
            cd "$publish_dir"
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rm -rf docs
          mkdir -p docs
          cp -R "$GITHUB_WORKSPACE/_quarto/_site/." docs/

          git add docs

          if git diff --cached --quiet; then
            echo "No docs changes to publish"
            exit 0
          fi

          git commit -m "Deploy Quarto docs"
          git push origin gh-pages
