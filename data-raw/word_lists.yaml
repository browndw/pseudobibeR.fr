# f_62 (D-48): short adverbs that normally precede an infinitive (pour mieux
# comprendre, sans trop savoir), so their position is not an interruption.
# UD French-GSD: mieux 8:1, bien 4:1 before:after; -ment adverbs 9:70.
preinfinitival_light_adverbs:
  - bien
  - mal
  - mieux
  - trop
  - peu
  - assez
  - beaucoup
  - tant
  - tout

# f_61 (D-29, D-47): colloquial competitors of pied-piping in que-relatives.
# Orphan prepositions/adverbs with no complement (la fille que je sors avec).
orphan_prepositions:
  - avec
  - pour
  - sans
  - contre
  - dessus
  - dessous
  - dedans
# Verb + preposition frames with a resumptive tonic pronoun (que je compte
# sur lui); parallel to Spanish hablar_de/depender_de/confiar_en.
resumptive_prepositional_frames:
  - parler_de
  - dépendre_de
  - compter_sur
  - fier_à
# Verbs whose de-complement dont would replace, with resumptive en
# (le film que je t'en ai parlé / dont je t'ai parlé).
resumptive_en_verbs:
  - parler
  - souvenir
  - rêver
  - occuper
  - dépendre

# f_60 (D-27, D-46): predicates whose que-clause competes with a bare
# infinitive or unmarked finite complement (je crois avoir compris / je crois
# que j'ai compris). Parallel to Spanish reduced_complement_predicates.
reduced_complement_predicates:
  - croire
  - penser
  - espérer
  - dire
  - affirmer
  - prétendre

# f_59 (D-26, D-30, D-45): colloquial reductions that compete with an
# available full form (p'tit/petit, chuis/je suis, y'a/il y a). Obligatory
# elision (j'ai, l'homme, c'est) has no competitor and is never counted.
# Productive t'/j' reductions and subjectless "y a" are rule-based.
colloquial_contractions:
  - "p'tit"
  - "p'tite"
  - "p'tits"
  - "p'tites"
  - "m'sieur"
  - "m'dame"
  - "chuis"
  - "chui"
  - "ch'suis"
  - "j'suis"
  - "chais"
  - "ch'ais"
  - "j'sais"
  - "y'a"

