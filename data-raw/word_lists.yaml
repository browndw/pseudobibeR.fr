# Negation (D-18/D-20, Tottie): synthetic negation (f_66) is a negative word,
# counted per occurrence, including in concord with ne. sans is deferred, as
# Spanish sin. Analytic negation (f_67) is the particle pas, point or plus; the
# concord clitic ne is not a negator by itself and is not counted.
neg_synthetic_determiners:
  - aucun
  - aucune
  - aucuns
  - aucunes
  - nul
  - nulle
  - nuls
  - nulles
  - personne
  - rien
  - jamais
  - ni
  - aucunement
  - nullement
negation_particles:
  - ne
neg_analytic_adverbs:
  - pas
  - point
  - plus

# Accent variants: the build script adds unaccented twins of accented entries
# (très -> tres) so that unaccented input is recognized, except when the
# unaccented form is a different grammatical word listed here (là/la, sûr/sur,
# à/a, où/ou). Nominalization suffixes are kept exact (-ité must not become -ite).
accent_contrastive_forms:
  - a
  - la
  - ou
  - du
  - des
  - sur
  - mur
  - cote
  - cite
