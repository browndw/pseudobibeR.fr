# French feature dictionaries (Biber 1985, 1988)
#
# Entries are matched on the parser's word rows, sentence by sentence
# (dictionary_evidence()). Underscores separate words; an apostrophe ends a
# word ("loin_d_'_ici" matches loin d' ici). Straight and curly apostrophes and
# split elisions are matched. A phrase takes precedence over words it contains.
# Verb classes (f_52-f_58) match lemmas; keep verbs in the infinitive.
#
# Ambiguous items (donc, ensuite, vraiment) are listed in one feature and
# reassigned by position in disambiguate_stance_fr(), so each occurrence is
# counted in one feature only.
#
f_04_place_adverbials:
