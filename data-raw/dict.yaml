  - imaginer
  - oublier
  - penser
  - pressentir
  - prévoir
  - rappeler
  - réaliser
  # reconnaître → f_55_verb_public (core meaning: public acknowledgment)
  - sentir # je sens que...
  - supposer
  - trouver # je trouve que...
f_57_verb_suasive:
  - accepter  # Core meaning: agreeing/complying
  - accorder
  - commander
  - conseiller
  - convaincre
  # décider → f_56_verb_private (core meaning: mental decision-making)
  - demander
  - donner_des_instructions
  - encourager
  - exiger
  # insister → f_55_verb_public (core meaning: public assertion)
  - inviter
  - mendier
  - nantir
  - ordonner
  - organiser
  - persuader
  - prononcer
  - proposer
  - recommander
  - stipuler
  - suggérer  # Core meaning: advising/recommending
f_58_verb_seem:
  - apparaître
  - avoir_l_'_air
  - paraître
  - sembler
