f_51_demonstratives:
  # Detected structurally (ce/cet/cette/ces as determiners) in
  # block_lexical_membership_fr(); no dictionary entries needed.
# Modals rely on lemma matching (block_modals_fr()); keep verbs in the infinitive.
f_52_modal_possibility:
  - pouvoir
  # sembler assigned to f_58_verb_seem
f_53_modal_necessity:
  - devoir  # Primary meaning; predictive uses ("il doit être 5h") assigned here
  - falloir
f_54_modal_predictive:
  # Detected from morphology in block_modals_fr(): future and conditional
  # forms and aller + infinitive (D-40). No dictionary entries needed.
f_55_verb_public:
  # accepter → f_57_verb_suasive (core meaning: compliance)
  - affirmer
  - annoncer
  - commenter
  - déclarer
  - écrire
  - expliquer
  - informer
  - insister  # Core meaning: asserting publicly
  - jurer
  - mentionner
  - nier
  - parler
  - proclamer
  - promettre
  - protester
  - raconter
  - réclamer
  - reconnaître  # Core meaning: acknowledging publicly
  - remarquer
  - répondre
  - se_plaindre
  - signaler
  # suggérer → f_57_verb_suasive (core meaning: recommending)
f_56_verb_private: # = verbs of mental processes / internal states
  - anticiper
  - apprendre
  - assumer
  - comprendre
  - conclure
  - connaître
  - constater
  - craindre
  - croire
  - décider
  - découvrir
