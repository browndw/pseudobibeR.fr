# Display names for French output columns (shared identifier: display name).
# Detectors, evidence, tests and CROSS_LANGUAGE_ALIGNMENT.md use the shared
# identifiers; biber() and audit_features() show these names unless
# feature_names = "shared". Each display name keeps its f_NN_ number, which is
# the same feature in every package of the family. Features not listed keep
# the shared name. Rebuild with: Rscript data-raw/build_feature_names.R
