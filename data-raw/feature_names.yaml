f_12_proverb_do: f_12_proverb_faire
f_15_gerunds: f_15_nominal_infinitives
f_18_by_passives: f_18_agent_passives
f_19_be_main_verb: f_19_copula_main_verb
f_20_existential_there: f_20_existential
f_21_that_verb_comp: f_21_que_verb_comp
f_22_that_adj_comp: f_22_que_adj_comp
f_27_past_participle_whiz: f_27_past_participle_reduced_relative
f_28_present_participle_whiz: f_28_present_participle_reduced_relative
f_29_that_subj: f_29_qui_subj
f_30_that_obj: f_30_que_obj
f_31_wh_subj: f_31_lequel_subj
f_32_wh_obj: f_32_lequel_obj
f_35_because: f_35_causal
f_36_though: f_36_concessive
f_37_if: f_37_conditional
f_59_contractions: f_59_reduced_forms
